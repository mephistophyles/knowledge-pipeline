# Litestream continuous replication of the SQLite control plane (plan §14.2).
# The default file replica sits on the SAME disk as the DB: it protects against a bad
# write, not a dead disk. On halo, add an off-box replica (sftp to the Mac Studio is
# the zero-cost option; see local-migration-playbook.md). Restore: `litestream restore`.
dbs:
  - path: /data/pipeline.db
    replicas:
      - type: file
        path: /data/litestream-replica
