# Portable stack: one `docker compose up` runs orchestrator + workers + dashboard +
# litestream, all against ./data/pipeline.db (the single SQLite writer boundary).
#
# Inference is NOT in this stack — it is the host's Ollama / llama-server. Note that
# inside a container `localhost:11434` is the container, not the host; on halo we run
# the pipeline under uv + systemd instead (see local-migration-playbook.md).

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: knowledge-pipeline:local
  volumes:
    - ./data:/app/data          # DB, raw store, intermediates
    - ./vault:/app/vault        # the Obsidian vault git repo
    - ./config:/app/config      # edit config without a rebuild
  environment:
    - PIPELINE_CONFIG=config/pipeline.yaml
  restart: unless-stopped

services:
  # Bootstrap DB + vault once, then exit. Other services wait on it.
  init:
    <<: *app
    restart: "no"
    command: ["init"]

  orchestrator:
    <<: *app
    command: ["scheduler"]
    depends_on:
      init:
        condition: service_completed_successfully

  worker-io:
    <<: *app
    command: ["worker", "io"]
    depends_on:
      init:
        condition: service_completed_successfully

  worker-llm:
    <<: *app
    command: ["worker", "llm"]
    depends_on:
      init:
        condition: service_completed_successfully

  worker-cheap:
    <<: *app
    command: ["worker", "cheap"]
    depends_on:
      init:
        condition: service_completed_successfully

  dashboard:
    <<: *app
    entrypoint: ["uvicorn"]
    command: ["dashboard.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"           # LAN only. The dashboard is a WRITE surface (authors form, stop) — never expose it publicly
    depends_on:
      init:
        condition: service_completed_successfully

  # Continuous SQLite backup. See docker/litestream.yml for the off-box replica.
  litestream:
    image: litestream/litestream:0.3
    volumes:
      - ./data:/data
      - ./docker/litestream.yml:/etc/litestream.yml:ro
    command: ["replicate"]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
