# Canonical author identities — the curated record.
#
# ONE author = ONE id, however many publications they write through. The sources differ;
# the author does not. Prefer a person's name where a person is speaking, and the brand
# where the brand is (a partnership, a rotating byline, a publication whose voice IS the
# product). Do not fracture a company into its partners: tracking a16z is worth more than
# tracking each partner separately.
#
# `aliases` are channel keys: sending addresses AND web hostnames. Hostnames are listed so
# that when the same essay arrives by web it resolves to the SAME author and cannot
# corroborate itself. Shared platforms (substack.com, beehiiv.com, gmail.com) are never
# aliased — they identify the platform, not the writer.
#
# Applied with `pipeline identity sync`, which writes these as CURATED. Harvested
# proposals are unconfirmed until they appear here.
